name: Maven CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Java 17 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Maven tests
        run: bash ./mvnw -B clean test -Dtest=CiIntentionalMissingTest
