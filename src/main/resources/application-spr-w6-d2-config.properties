# SPR-W6-D2-02/03: グループ末尾で既存DB設定を上書きし、毎起動専用メモリDBへ同じサンプルを用意する。
spring.datasource.url=jdbc:h2:mem:sprw6d2-${random.uuid};DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.default_batch_fetch_size=0
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.example.demo.training.relations.RelationSqlTrace
spring.output.ansi.enabled=never
training.relations.fetch-mode=LAZY
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
