# SPR-W6-D5-01: Day1の保存DBと分離し、同じD5 DBへ再起動後も接続する。
spring.datasource.url=jdbc:h2:file:./data/spr-w6-d5;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
app.environment-name=spr-w6-d5
spring.output.ansi.enabled=never
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
# 通し実行のSQLとcommit/rollbackを実ログに残す。通常Profileには適用しない。
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
