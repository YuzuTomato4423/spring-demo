# SPR-W5-D1-01: 名前付きメモリDBを使い、アプリとH2 Consoleを同じ接続先へ向ける。
# 学習用のsa/空パスワード。本番環境・外部DBの認証情報ではない。
spring.datasource.url=jdbc:h2:mem:sprw5d1;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# SPR-W5-D1-01: 課題用ProfileでのみH2 Consoleを有効化し、接続と表を確認する。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SPR-W5-D1-03: Entity定義から起動時に表を生成し、終了時に破棄する学習用設定。
# インメモリDBのため再起動するとデータは初期化される。永続ファイルは作成しない。
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# SPR-W5-D1-04: Hibernateが発行したSQLをConsoleで読み、EntityとDDLの対応を学ぶ。
# 色装飾を使わずSQLを整形して表示する。実運用向けのログ設定ではない。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.output.ansi.enabled=never
