# SPR-W6-D1-03: devの永続ファイルをテストで変更しないよう、起動ごとに独立するメモリDBを使う。
spring.config.activate.on-profile=spr-w6-d1
app.environment-name=test
spring.datasource.url=jdbc:h2:mem:sprw6d1-test-${random.uuid};DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.h2.console.enabled=false
