# SPR-1008-03: 同じコードで環境別設定を読み分ける学習用Profile。
# 表示に[dev]を付け、環境の取り違えを実行結果で識別する。実際の本番接続は行わない。
app.message=Hello Spring! [dev]
app.environment-name=dev

#---
spring.config.activate.on-profile=spr-w6-d1
# SPR-W6-D1-01: メモリDBは終了で消えるためfile DBへ変更し、再起動後も社員を保持する。
# Eclipseの作業ディレクトリはプロジェクト直下。実体はdata/spr-w6-d1.mv.db。
spring.datasource.url=jdbc:h2:file:./data/spr-w6-d1;DB_CLOSE_ON_EXIT=FALSE
# SPR-W6-D1-02: create-dropでは終了時に表が消えるため、開発時はupdateで既存データを保持する。
# 再起動前POSTの採番IDを再起動後GET/H2で照合し、別DBへの誤接続も検出する。
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.h2.console.enabled=true
