spring.application.name=spring-demo

# SPR-1008-01: 環境ごとの変更をコードから分離し、再実装せず設定で切り替える。
# message: /hello が返す表示文。Profile未指定時は従来のレスポンスを維持する。
app.message=Hello Spring!
# environment-name: 実行環境を学習ログで識別するための名前。
app.environment-name=default
# SPR-1008-04: 秘密情報の値をJava/設定ファイルへ直書きせず、実行環境から渡す。
# 実習では架空のサンプルのみ使用する。実パスワードの漏えい・誤接続を防ぐため。
# 未設定時は空文字。これは外部注入の学習用であり、認証/DB接続には使用しない。
app.sample-password=${SPR1008_SAMPLE_PASSWORD:}

# SPR-W6-D1-03: Week6は既存JPA/APIを再利用。dev/testは起動時にどちらか一方を末尾に指定する。
spring.profiles.group.spr-w6-d1=spr-w5-d1,spr-w5-d2
# SPR-W6-D2: 既存JPA/APIを同じプロジェクトで再利用。Day1のfile DB用Profileは含めない。
spring.profiles.group.spr-w6-d2=spr-w5-d1,spr-w5-d2,spr-w6-d2-config
# SPR-W6-D3: REST/JPAを再利用し、最後の専用設定で保存DBから分離する。
spring.profiles.group.spr-w6-d3=spr-w5-d1,spr-w5-d2,spr-w6-d3-config

# SPR-W6-D5-01: Day3の業務APIを再利用し、最後のD5設定だけで専用永続DBへ切り替える。
spring.profiles.group.spr-w6-d5=spr-w6-d3,spr-w6-d5-config
