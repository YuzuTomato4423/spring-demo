# SPR-W7-D2-02: 開発用file DBと過去課題のtest設定を変更せず、Day2だけを独立したメモリDBへ接続する。
# ActiveProfilesはspr-w6-d3,test,spr-w7-d2-testの順。最後の専用Profileで接続先を確定する。
app.environment-name=test
spring.datasource.url=jdbc:h2:mem:sprw7d2-test-${random.uuid};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.output.ansi.enabled=never
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
